name: Mantenimiento programado

on:
  schedule:
    - cron: '0 13 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar servicio
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" js/supabase.js | head -1)
          KEY=$(grep -oE "eyJ[A-Za-z0-9._-]+" js/supabase.js | head -1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Configuración no encontrada"; exit 1
          fi
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/courses?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta: $CODIGO"
          test "$CODIGO" = "200"
